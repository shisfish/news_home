<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站升级中</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5em;
            color: #333333;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5em;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>网站正在升级中……</h1>
        <p>请耐心等待。</p>
    </div>
</body>
</html>
